name: Feature request
description: Suggest a shared library improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: Explain the need in ATIV, EnCAP, or another host.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
