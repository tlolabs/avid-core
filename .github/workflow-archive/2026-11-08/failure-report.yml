name: CI/CD failure report
on:
  workflow_run:
    workflows:
      - shared-core
      - Windows lrintf compiler regression
      - FFmpeg native candidate verification
      - FFmpeg platform direct downloads
      - Publish existing verified FFmpeg platforms
      - Promote verified Core runtime
      - source-release
      - Linux lifecycle race regression
      - Windows runtime lifecycle stress
      - Recipe 6 failure investigation
      - Windows compiler isolation
      - Dependabot Updates
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
  security-events: read
jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh the consolidated failure and security report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_ci_failure_report.py
