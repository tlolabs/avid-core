name: shared-core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  external-media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install an external pair for library integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Exercise media operations without Core runtime assets
        env:
          AVID_TEST_FFMPEG: /usr/bin/ffmpeg
          AVID_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --test ffmpeg -- --ignored --test-threads=1
      - name: Verify child release with externally supplied tools
        env:
          AVID_RUNTIME_DIRECTORY: /usr/bin
        run: cargo test --locked --test runtime_contract -- --ignored --test-threads=1
