name: FFmpeg platform direct downloads
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ffmpeg-independent.yml
      - .github/workflows/ffmpeg-build.yml
      - .github/workflows/platform-publisher.yml
      - runtime/ffmpeg/**
      - scripts/ffmpeg/**
      - script/core_runtime.py
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffmpeg-platform-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build-macos-arm64:
    name: build (macos-arm64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: macos-arm64
      runner: macos-15
    permissions:
      contents: read
  publish-macos-arm64:
    name: publish (macos-arm64)
    needs: build-macos-arm64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: macos-arm64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write

  build-macos-x86-64:
    name: build (macos-x86_64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: macos-x86_64
      runner: macos-15-intel
    permissions:
      contents: read
  publish-macos-x86-64:
    name: publish (macos-x86_64)
    needs: build-macos-x86-64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: macos-x86_64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write

  build-windows-arm64:
    name: build (windows-arm64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: windows-arm64
      runner: windows-11-arm
    permissions:
      contents: read
  publish-windows-arm64:
    name: publish (windows-arm64)
    needs: build-windows-arm64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: windows-arm64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write

  build-windows-x86-64:
    name: build (windows-x86_64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: windows-x86_64
      runner: windows-2025
    permissions:
      contents: read
  publish-windows-x86-64:
    name: publish (windows-x86_64)
    needs: build-windows-x86-64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: windows-x86_64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write

  build-linux-arm64:
    name: build (linux-arm64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: linux-arm64
      runner: ubuntu-24.04-arm
    permissions:
      contents: read
  publish-linux-arm64:
    name: publish (linux-arm64)
    needs: build-linux-arm64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: linux-arm64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write

  build-linux-x86-64:
    name: build (linux-x86_64)
    uses: ./.github/workflows/ffmpeg-build.yml
    with:
      target: linux-x86_64
      runner: ubuntu-24.04
    permissions:
      contents: read
  publish-linux-x86-64:
    name: publish (linux-x86_64)
    needs: build-linux-x86-64
    uses: ./.github/workflows/platform-publisher.yml
    with:
      target: linux-x86_64
      source_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: write
