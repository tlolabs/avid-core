name: Promote qualified Core runtime
on:
  push:
    tags: ['ffmpeg-*-r*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-runtime-promotion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release controls
        run: python3 -m unittest discover -s script -p test_core_release.py -v
      - name: Verify exact approved candidate origin before downloading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'script')
          from core_runtime import candidate,obj
          plan=obj('runtime/releases/ffmpeg-9.0.1-r7.1.plan.json')
          for target in sorted(plan['targets']):
              candidate(plan,target,Path('build/qualified')/target,qualification=True)
          PY
      - name: Verify immutable runtime release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = ffmpeg-9.0.1-r7.1
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git diff --exit-code 25d19098a22936638b0e2a70616083d929fe409c "$GITHUB_SHA" -- src Cargo.toml Cargo.lock runtime/ffmpeg/spec.json scripts/ffmpeg
      - name: Apply owner acceptance and stage the exact successful native builds
        run: python3 script/core_release.py promote --plan runtime/releases/ffmpeg-9.0.1-r7.1.plan.json --directory build/qualified --output release-assets
      - name: Attest promotion identity, not original build identity
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*
      - name: Publish only the new complete runtime release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release identity already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file docs/ffmpeg/runtime-release-notes.md
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release download "$GITHUB_REF_NAME" --dir verified-downloads
          (cd verified-downloads && sha256sum --check SHA256SUMS)
          gh attestation verify verified-downloads/manifest.json --repo tlolabs/avid-core --signer-workflow tlolabs/avid-core/.github/workflows/runtime-release.yml --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
