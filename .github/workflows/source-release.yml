name: source-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  stable-source:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owner-authorized source release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Validate source and dependency inventory
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo test --locked --doc
          cargo clippy --locked --all-targets --all-features -- -D warnings
          python3 script/dependency_inventory.py --check
      - name: Package source, SBOM, and checksums
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          mkdir -p dist
          cp "target/package/avid-core-${GITHUB_REF_NAME#v}.crate" dist/
          python3 script/dependency_inventory.py --sbom "dist/avid-core-${GITHUB_REF_NAME#v}.cdx.json"
          cd dist
          sha256sum ./*.crate ./*.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "AVID Core $RELEASE_TAG"
