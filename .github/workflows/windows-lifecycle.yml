name: Windows runtime replacement investigation
on:
  push:
    branches: [codex/ffmpeg-runtime-qualification]
    paths: ['.github/workflows/windows-lifecycle.yml', '.github/scripts/runtime_locks.c', '.github/scripts/runtime_exit_control.c', '.github/scripts/verify_child_trace.py', '.github/scripts/run_windows_lifecycle.py', 'tests/support/windows_runtime_owners.rs']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replacement:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the exact failing Core-built pair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .ffmpeg-work/locks | Out-Null
          @'
          import subprocess,hashlib,json,zipfile,io
          from pathlib import Path
          aid=10460866442
          metadata=json.loads(subprocess.check_output(['gh','api',f'repos/tlolabs/avid-core/actions/artifacts/{aid}']))
          data=subprocess.check_output(['gh','api',f'repos/tlolabs/avid-core/actions/artifacts/{aid}/zip'])
          assert metadata['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          root=Path('.ffmpeg-work/locks/runtime');root.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in ['ffmpeg.exe','ffprobe.exe','spec.json','build.json','validation.json']:
                  path=next(p for p in z.namelist() if p.endswith('/'+name) or p==name)
                  (root/name).write_bytes(z.read(path))
          validation=json.loads((root/'validation.json').read_text())
          for name,h in validation['binary_sha256'].items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h
          print(json.dumps(validation['binary_sha256']))
          '@ | python -
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang
      - name: Compile scoped read-only resource-owner diagnostic
        shell: msys2 {0}
        run: |
          clang -O2 -static -municode .github/scripts/runtime_locks.c -lrstrtmgr -o .ffmpeg-work/locks/owners.exe
          clang -O2 -static -municode .github/scripts/runtime_exit_control.c -o .ffmpeg-work/locks/exit-control.exe
      - name: Obtain Microsoft-signed handle inspector for scoped failure snapshots
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile .ffmpeg-work/locks/Handle.zip
          Expand-Archive .ffmpeg-work/locks/Handle.zip .ffmpeg-work/locks/handle
          $path = '.ffmpeg-work/locks/handle/handle64.exe'
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Untrusted handle inspector' }
          Write-Output ('inspector_sha256=' + (Get-FileHash $path).Hash)
      - name: Reproduce with sanitized runtime-scoped diagnostics only
        shell: pwsh
        run: python .github/scripts/run_windows_lifecycle.py
