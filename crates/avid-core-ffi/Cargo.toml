[package]
name = "avid-core-ffi"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
whisper = ["avid-transcription/whisper"]

[dependencies]
avid-core = { path = "../..", version = "=0.4.1" }
avid-transcription = { path = "../avid-transcription", version = "=0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
png = "=0.18.1"
tempfile = "3.27"
