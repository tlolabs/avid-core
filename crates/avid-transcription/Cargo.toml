[package]
name = "avid-transcription"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Offline linked transcription contracts, verified model leases, and portable Whisper inference"

[features]
default = []
whisper = ["dep:avid-whisper-bridge", "dep:avid-media-bridge"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
fs2 = "=0.4.3"
avid-whisper-bridge = { path = "../avid-whisper-bridge", optional = true }
avid-media-bridge = { path = "../avid-media-bridge", optional = true }

[[example]]
name = "recognize"
required-features = ["whisper"]
